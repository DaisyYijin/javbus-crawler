# 直接拉取镜像运行（无需克隆仓库）：
#   1. 把本文件保存为 docker-compose.yml
#   2. docker compose run --rm crawler --pages 1   （data/ 目录会自动创建）
# 更新镜像：docker compose pull
# 源码构建：docker build -t ghcr.io/daisyyijin/javbus-crawler:latest .
services:
  crawler:
    image: ghcr.io/daisyyijin/javbus-crawler:latest
    container_name: seedmm-crawler
    volumes:
      - ./data:/data
    environment:
      SEEDMM_BASE: https://www.seedmm.bond
      DB_PATH: /data/seedmm.db
      DELAY_SECONDS: "2.0"
      JITTER_SECONDS: "1.0"
      MAX_RETRIES: "3"
      TIMEOUT: "30"
    restart: "no"
